name: ci-main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    environment: cicd-lab

    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint et sécurité
        run: |
          ruff check app tests --select E9,F63,F7,F82
          bandit -r app -q

      - name: Tests unitaires + couverture
        run: |
          python -m pytest tests/units -v --cov=app --cov-report=term-missing

      - name: PostgreSQL + migrations
        run: |
          docker compose up -d --wait db
          docker compose run --rm flyway migrate
          docker compose run --rm flyway validate

      - name: Tests
        run: python -m pytest -v

      - name: Build Docker
        run: docker build -t projet-f68:${{ github.sha }} .

      - name: Nettoyage
        if: always()
        run: |
          docker compose down -v